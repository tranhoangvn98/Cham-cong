server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # An phien ban nginx.
  server_tokens off;

  # Header bao mat co ban. CSP chi cho phep tai nguyen cung goc + anh blob.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; connect-src *; frame-ancestors 'none'; base-uri 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Tep co bam trong ten -> cache lau.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Font tu chua: ten tep khong co bam nen khong the cache 1 nam, nhung 7 ngay du de
  # khong tai lai 180 KB moi lan mo trang.
  location /font/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # SPA: moi duong dan khong phai tep deu tra index.html de router phia client xu ly.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
